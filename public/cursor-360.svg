<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Zwei Kreispfeile um die Kugel -->
  <!-- Oberer Bogen mit Pfeil -->
  <path d="M 8 18 A 10 10 0 0 1 28 18" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="28,18 24,14 31,13" fill="white"/>
  <!-- Unterer Bogen mit Pfeil -->
  <path d="M 28 18 A 10 10 0 0 1 8 18" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="8,18 12,22 5,23" fill="white"/>
  <!-- "360" Text -->
  <text x="18" y="21" text-anchor="middle" fill="white" font-size="8" font-weight="bold" font-family="Arial,sans-serif">360°</text>
</svg>
