<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Kugel -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="2"/>
  <!-- Horizontale Linie auf der Kugel -->
  <ellipse cx="16" cy="16" rx="10" ry="4" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <!-- Vertikale Linie -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <!-- Pfeil oben -->
  <polygon points="16,2 13,7 19,7" fill="white"/>
  <!-- Pfeil unten -->
  <polygon points="16,30 13,25 19,25" fill="white"/>
  <!-- Pfeil links -->
  <polygon points="2,16 7,13 7,19" fill="white"/>
  <!-- Pfeil rechts -->
  <polygon points="30,16 25,13 25,19" fill="white"/>
</svg>
